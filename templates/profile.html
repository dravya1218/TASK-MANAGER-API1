{% extends "base.html" %}

{% block title %}
Profile
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h3>My Profile</h3>
        </div>

        <div class="card-body">

            <div id="error"
                 class="alert alert-danger d-none">
            </div>

            <form id="profileForm">

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        id="username"
                        class="form-control"
                        type="text">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        id="email"
                        class="form-control"
                        type="email">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Role
                    </label>

                    <input
                        id="role"
                        class="form-control"
                        readonly>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Changes

                </button>

            </form>

            <form id="verifyEmailChangeForm" class="d-none mt-4">

                <h4>Verify New Email</h4>

                <p class="text-muted">
                    Enter the OTP sent to your new email address.
                </p>

                <div class="mb-3">
                    <label class="form-label">Verification OTP</label>
                    <input id="emailChangeOtp" class="form-control" type="text" maxlength="6" inputmode="numeric" required>
                </div>

                <button id="verifyEmailChangeButton" type="submit" class="btn btn-success">
                    Verify New Email
                </button>

            </form>

            <hr>

            <h4>Change Password</h4>

            <form id="changePasswordForm">

                <div class="mb-3">
                    <label class="form-label">Current Password</label>
                    <input id="currentPassword" class="form-control" type="password" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input id="newPassword" class="form-control" type="password" minlength="6" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                    <input id="confirmPassword" class="form-control" type="password" minlength="6" required>
                </div>

                <button type="submit" class="btn btn-outline-primary">
                    Change Password
                </button>

            </form>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script src="{{ url_for('static', filename='js/profile.js') }}"></script>

{% endblock %}
