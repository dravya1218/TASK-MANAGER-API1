{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header text-center">
                    <h2>Create Account</h2>
                </div>

                <div class="card-body">
                    <div id="error" class="alert alert-danger d-none"></div>
                    <div id="success" class="alert alert-success d-none"></div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input id="username" class="form-control" type="text" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input id="email" class="form-control" type="email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input id="password" class="form-control" type="password" minlength="6" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input id="confirmPassword" class="form-control" type="password" minlength="6" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Register
                        </button>
                    </form>

                    <form id="verifyForm" class="d-none">
                        <p class="text-muted">
                            Check your email for the six-digit OTP, then enter it below.
                        </p>

                        <div class="mb-3">
                            <label class="form-label">Verification OTP</label>
                            <input id="otp" class="form-control" type="text" maxlength="6" inputmode="numeric" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Verify Email
                        </button>
                    </form>

                    <hr>

                    <p class="text-center mb-0">
                        Already have an account?
                        <a href="/login">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>

{% endblock %}
